# Adapted from the DockerSolutionsEngineering/ai.gov.sbx-vscode-ssh PoC by
# @philippecharriere494 (demo 01-remote-ssh). See docs/VSCODE-NOTES.md.
schemaVersion: "1"
kind: mixin
name: sbx-ide-remote-ssh
displayName: sbx-ide VS Code Remote-SSH
description: "Run a real OpenSSH server inside the sandbox so VS Code can connect from the host over Remote-SSH to a published loopback port — bypassing sandboxd's emulated SSH endpoint (which makes VS Code Remote-SSH retry-loop)."

# Only the domains needed to install openssh and download the VS Code server +
# marketplace extensions. The sandbox's egress proxy denies everything else.
network:
  allowedDomains:
    - "archive.ubuntu.com:80"
    - "security.ubuntu.com:80"
    - "ports.ubuntu.com:80"
    - "update.code.visualstudio.com:443"
    - "vscode.download.prss.microsoft.com:443"
    - "*.vo.msecnd.net:443"
    - "marketplace.visualstudio.com:443"
    - "*.gallery.vsassets.io:443"
    - "*.gallerycdn.vsassets.io:443"

commands:
  install:
    - command: "apt-get -o DPkg::Lock::Timeout=600 update && DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=600 install -yy --no-install-recommends openssh-server && apt-get clean && rm -rf /var/lib/apt/lists/* && mkdir -p /run/sshd && chmod 0755 /run/sshd"
      user: "root"
      description: "Install OpenSSH server"

    - command: "install -d -m 0700 -o agent -g agent /home/agent/.ssh && touch /home/agent/.ssh/authorized_keys && chown agent:agent /home/agent/.ssh/authorized_keys && chmod 0600 /home/agent/.ssh/authorized_keys"
      user: "root"
      description: "Prepare ~/.ssh with the ownership and modes sshd insists on"

    - command: |
        touch /etc/sandbox-persistent.sh
        grep -qF '/home/agent/.local/bin' /etc/sandbox-persistent.sh || \
          printf '\n# sbx-ide remote-ssh: expose user-local bins (claude, npm-global) to SSH sessions\nexport PATH="/home/agent/.local/bin:/usr/local/share/npm-global/bin:$PATH"\n' >> /etc/sandbox-persistent.sh
      user: "root"
      description: "Expose /home/agent/.local/bin and npm-global on PATH for SSH login shells"

    - command: |
        cat > /etc/ssh/sshd_config.d/10-sbx-ide.conf <<'EOF'
        Port 22
        ListenAddress 0.0.0.0
        Protocol 2
        PermitRootLogin no
        PasswordAuthentication no
        ChallengeResponseAuthentication no
        KbdInteractiveAuthentication no
        UsePAM yes
        PubkeyAuthentication yes
        AuthorizedKeysFile %h/.ssh/authorized_keys
        X11Forwarding no
        AllowAgentForwarding yes
        AllowTcpForwarding yes
        AcceptEnv LANG LC_*
        ClientAliveInterval 60
        ClientAliveCountMax 3
        AllowUsers agent
        EOF
        chmod 0644 /etc/ssh/sshd_config.d/10-sbx-ide.conf
        ssh-keygen -A
      user: "root"
      description: "Write sshd drop-in (key-only auth, agent only) and generate host keys"

  startup:
    - command: ["sh", "-c", "mkdir -p /run/sshd && chmod 0755 /run/sshd"]
      user: "root"
      background: false
      description: "Ensure /run/sshd exists"

    # An interrupted VS Code-server install leaves a half-finished *.staging dir
    # and stale *.lock files; the CLI then re-downloads on every connect. Clean
    # them up at each boot.
    - command:
        - "sh"
        - "-c"
        - |
          rm -rf /home/agent/.vscode-server/cli/servers/*.staging 2>/dev/null || true
          find /home/agent/.vscode-server -name '*.lock' -type f -delete 2>/dev/null || true
          exit 0
      user: "root"
      background: false
      description: "Clean stale VS Code-server staging dirs and lock files"

    # sshd sessions don't inherit sandboxd's proxy env (PAM reads /etc/environment),
    # so without this claude would hit api.anthropic.com directly, the proxy would
    # not inject the API key, and you'd get "Invalid API key". The block is delimited
    # so it can be rewritten each boot (ports/certs change per container).
    - command:
        - "sh"
        - "-c"
        - |
          touch /etc/sandbox-persistent.sh
          sed -i '/# >>> sbx-proxy >>>/,/# <<< sbx-proxy <<</d' /etc/sandbox-persistent.sh
          {
            echo '# >>> sbx-proxy >>>'
            [ -n "$HTTP_PROXY" ]          && echo "export HTTP_PROXY=\"$HTTP_PROXY\""
            [ -n "$HTTPS_PROXY" ]         && echo "export HTTPS_PROXY=\"$HTTPS_PROXY\""
            [ -n "$NO_PROXY" ]            && echo "export NO_PROXY=\"$NO_PROXY\""
            [ -n "$http_proxy" ]          && echo "export http_proxy=\"$http_proxy\""
            [ -n "$https_proxy" ]         && echo "export https_proxy=\"$https_proxy\""
            [ -n "$no_proxy" ]            && echo "export no_proxy=\"$no_proxy\""
            [ -n "$PROXY_CA_CERT_B64" ]   && echo "export PROXY_CA_CERT_B64=\"$PROXY_CA_CERT_B64\""
            [ -n "$NODE_EXTRA_CA_CERTS" ] && echo "export NODE_EXTRA_CA_CERTS=\"$NODE_EXTRA_CA_CERTS\""
            echo '# <<< sbx-proxy <<<'
          } >> /etc/sandbox-persistent.sh
      user: "root"
      background: false
      description: "Sync sandboxd proxy env to /etc/sandbox-persistent.sh so SSH sessions (and claude) reach the proxy"

    - command: ["/usr/sbin/sshd", "-D", "-e"]
      user: "root"
      background: true
      description: "Start sshd in the foreground"

    - command: ["sh", "-c", "for i in $(seq 1 40); do grep -q ':0016 ' /proc/net/tcp 2>/dev/null && exit 0; sleep 0.25; done; echo 'sshd failed to bind port 22' >&2; exit 1"]
      user: "root"
      background: false
      description: "Wait up to 10s for sshd to bind 0.0.0.0:22"

memory: |
  ## VS Code Remote-SSH access (sbx-ide)

  A real OpenSSH server runs on port 22 inside this sandbox; sbx-ide publishes it
  to a host loopback port and connects VS Code via Remote-SSH. Auth is key-only,
  `agent` user only. This bypasses sandboxd's emulated SSH (which makes VS Code
  Remote-SSH retry-loop). See docs/VSCODE-NOTES.md.
